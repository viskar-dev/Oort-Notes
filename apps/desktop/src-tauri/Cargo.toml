# apps/desktop/src-tauri/Cargo.toml

[package]
name = "note-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "note_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
note-core = { path = "../../../packages/core", features = ["keyring-store"] }
tauri.workspace = true
tauri-plugin-sql.workspace = true
tauri-plugin-opener.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
reqwest.workspace = true
tracing.workspace = true
dotenvy.workspace = true
# AI: MCP streamable-HTTP host over axum + random bearer token
rmcp.workspace = true
axum.workspace = true
rand.workspace = true
# native window caption panel (minimize/restore/close overlay)
tauri-plugin-decoration = "3"
# auto-update (updater: desktop targets only, see setup in lib.rs)
tauri-plugin-updater.workspace = true
tauri-plugin-process.workspace = true

[lints]
workspace = true

name: Release

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Windows-only release channel for now. macOS and Linux remain supported as
# local builds (see the README "Build installers" section); CI intentionally
# does not produce or publish those artifacts.
#
# Public desktop OAuth client id, baked into the binary at compile time.
# Set it under Settings -> Secrets and variables -> Actions -> Variables.
env:
  OORT_GOOGLE_CLIENT_ID: ${{ vars.OORT_GOOGLE_CLIENT_ID }}

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2

      - uses: dtolnay/rust-toolchain@stable

      # cargo workspace root is the repo root (single Cargo.lock)
      - uses: Swatinem/rust-cache@v2

      - name: Install dependencies
        run: |
          bun install --cwd apps/frontend
          bun install --cwd apps/desktop

      - name: Lint
        run: bun run --cwd apps/frontend lint

      - name: Test
        run: bun run --cwd apps/frontend test

      # debug compile of the full Tauri app (frontend builds via
      # beforeBuildCommand); --no-bundle keeps it signing-key-free
      - name: Debug build
        run: bun run --cwd apps/desktop tauri build --debug --no-bundle

  check-version:
    needs: verify
    runs-on: windows-latest
    outputs:
      is_new: ${{ steps.check.outputs.is_new }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      - name: Check if version is released
        id: check
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "is_new=false" >> "$GITHUB_OUTPUT"
          else
            echo "is_new=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: [verify, check-version]
    if: needs.check-version.outputs.is_new == 'true'
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install dependencies
        run: |
          bun install --cwd apps/frontend
          bun install --cwd apps/desktop

      - name: Check Google Drive OAuth client
        shell: bash
        run: |
          if [ -z "$OORT_GOOGLE_CLIENT_ID" ]; then
            echo "::warning::OORT_GOOGLE_CLIENT_ID is not set. Builds will not include a default Google Drive client; users must paste one in Backup settings."
          else
            echo "Google Drive OAuth client ID is set."
          fi

      - name: Validate updater signing key
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          node -e "
          const key = (process.env.TAURI_SIGNING_PRIVATE_KEY || '').trim();
          if (!key) {
            console.error('::error::TAURI_SIGNING_PRIVATE_KEY is not set. Add the repository secret with the full .key file contents.');
            process.exit(1);
          }
          if (!process.env.TAURI_SIGNING_PRIVATE_KEY_PASSWORD) {
            console.error('::error::TAURI_SIGNING_PRIVATE_KEY_PASSWORD is not set. Add the repository secret with the updater key password.');
            process.exit(1);
          }
          const text = key.startsWith('untrusted comment:')
            ? key
            : Buffer.from(key, 'base64').toString('utf8');
          const firstLine = text.split(/\r?\n/)[0];
          if (!firstLine.startsWith('untrusted comment:') || !firstLine.includes('secret key')) {
            console.error('::error::TAURI_SIGNING_PRIVATE_KEY is malformed. Paste the full contents of the .key file generated by tauri signer generate (the single base64 line), not the file path.');
            process.exit(1);
          }
          "
          # Prove the password decrypts the key before the expensive build.
          echo "updater signing key check" > apps/desktop/updater-sign-test.txt
          bun run --cwd apps/desktop tauri signer sign updater-sign-test.txt
          rm -f apps/desktop/updater-sign-test.txt apps/desktop/updater-sign-test.txt.sig

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tauriScript: bun run tauri
          tagName: v__VERSION__
          releaseName: "Oort Notes v__VERSION__"
          releaseDraft: true
          prerelease: false
          # NSIS is Tauri's recommended updater bundle on Windows
          updaterJsonPreferNsis: true

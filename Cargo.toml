# note-app/Cargo.toml

[workspace]
resolver = "2"
members = [
    "packages/core",
    "apps/server",
    "apps/desktop/src-tauri",
]

# Shared metadata inherited by all member crates
[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

# Single source of truth for dependency versions
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v7"] }
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio","migrate"] }
thiserror = "2"
anyhow = "1"
reqwest = { version = "0.12", features = ["json"] }
tracing = "0.1"
tracing-subscriber = "0.3"
base64 = "0.22"
rand = "0.8"
sha2 = "0.10"
url = "2"
# .env file loading (development convenience: one root .env feeds the
# server, the desktop app and — via Vite's envDir — the frontend)
dotenvy = "0.15"
# OS keychain access for the desktop refresh token (optional core feature)
keyring = { version = "4", default-features = false, features = ["v1"] }

# JSON Schema generation for the AI tool registry (derive included by default)
schemars = "1"
# OpenAI-compatible chat client for the AI agent loop (works with any base_url)
async-openai = { version = "0.42", features = ["chat-completion"] }
# Model Context Protocol server (AI: external clients drive the canvas over
# streamable HTTP; only the desktop crate depends on it)
rmcp = { version = "0.7", default-features = false, features = [
    "base64",
    "macros",
    "server",
    "transport-streamable-http-server",
] }
# HTTP framework — pinned here so the desktop MCP host matches note-server
axum = "0.8"

# Tauri dependencies (only used by the desktop crate, but version pinned here)
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-opener = "2"


[workspace.lints.clippy]
unwrap_used = "warn"
